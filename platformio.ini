; PlaneSpotter — ESP32-S3 + Good Display GDEY0579T93 (5.79", 792x272, B/W)

[platformio]
default_envs = planespotter

[env:planespotter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-DevKitC-1-N16R8 (16 MB flash, 8 MB octal PSRAM).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
build_unflags = -std=gnu++11

extra_scripts = pre:tools/pio_version.py

lib_deps =
    zinggjm/GxEPD2 @ ^1.6.4
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    adafruit/Adafruit GFX Library @ ^1.12.1
    bblanchon/ArduinoJson @ ^7.4.2
    ricmoo/QRCode @ ^0.0.1
